# Publishes to npm when a GitHub Release is published. Uses npm trusted publishing (OIDC): no npm token is stored
# in GitHub. Set it up once on npmjs.com → the package → Settings → Trusted publisher → GitHub Actions:
# organization nufel-web-hosting, repository kumpara-node, workflow publish.yml.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "Release tag ${GITHUB_REF_NAME} does not match package.json version"; exit 1; }

      - name: Publish
        run: npm publish --provenance --access public
